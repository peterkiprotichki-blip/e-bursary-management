<div class="space-y-4 p-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">Document Submissions</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">Review and verify the documents uploaded by applicants.</p>
    </div>
    
    <!-- Applicant Filter -->
    <div class="flex items-center gap-2" *ngIf="!loading && applicants.length > 0">
      <label for="applicantFilter" class="text-sm font-medium text-gray-700 dark:text-gray-300 whitespace-nowrap">Filter by Applicant:</label>
      <select id="applicantFilter" [(ngModel)]="selectedApplicantId" class="block w-full sm:w-64 rounded-lg border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-800 py-2 pl-3 pr-10 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 text-gray-900 dark:text-white">
        <option value="all">All Applicants</option>
        <option *ngFor="let app of applicants" [value]="app.id">{{ app.name }}</option>
      </select>
    </div>
  </div>

  <div *ngIf="error" class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg px-4 py-3 text-sm text-red-700 dark:text-red-300">
    {{ error }}
  </div>

  <div *ngIf="loading" class="rounded-xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-8 text-center text-sm text-gray-500 dark:text-gray-400">
    Loading documents...
  </div>

  <div *ngIf="!loading" class="grid gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
    <div *ngIf="!filteredDocuments.length" class="col-span-full py-16 text-center text-gray-400 dark:text-gray-500">
      No documents found.
    </div>

    <div *ngFor="let doc of filteredDocuments" class="overflow-hidden rounded-2xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 shadow-sm flex flex-col justify-between hover:shadow-md transition-shadow">
      <!-- Document Preview / Thumbnail -->
      <div class="relative aspect-video bg-gray-50 dark:bg-slate-900/60 overflow-hidden border-b border-gray-100 dark:border-slate-700 cursor-pointer" (click)="openPreview(doc.dataUrl)">
        <img [src]="getPreviewImageUrl(doc.dataUrl)" class="w-full h-full object-cover transition-transform duration-300 hover:scale-105" [alt]="doc.fileName" />
        <div class="absolute inset-0 bg-slate-950/20 opacity-0 hover:opacity-100 transition-opacity flex items-center justify-center">
          <i class="fas fa-eye text-white text-xl"></i>
        </div>
      </div>
      <!-- Document Details -->
      <div class="p-4 space-y-1.5">
        <span class="inline-flex items-center rounded-full bg-slate-100 text-slate-700 dark:bg-slate-700 dark:text-gray-300 px-2.5 py-0.5 text-[10px] font-semibold uppercase tracking-wider">
          {{ docLabel(doc.docName) }}
        </span>
        <div class="font-medium text-sm text-gray-900 dark:text-white truncate" [title]="doc.fileName">
          {{ doc.fileName }}
        </div>
        <div class="text-xs text-gray-500 dark:text-gray-400">
          Uploaded by: <span class="font-semibold text-gray-700 dark:text-gray-300">{{ doc.applicantName }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Image Preview Modal -->
  <div *ngIf="selectedImageUrl" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm" (click)="closePreview()">
    <div class="relative w-full max-w-5xl h-[90vh] overflow-hidden rounded-2xl bg-white dark:bg-slate-800 p-2 shadow-2xl flex flex-col" (click)="$event.stopPropagation()">
      <button (click)="closePreview()" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-slate-900/50 hover:bg-slate-900/80 text-white flex items-center justify-center transition-colors z-20 text-sm">
        <i class="fas fa-times"></i>
      </button>
      
      <!-- Native Object Tag for full multi-page PDF scrolling -->
      <object *ngIf="isPdf(selectedImageUrl) && safePreviewUrl" [data]="safePreviewUrl" type="application/pdf" class="w-full flex-1 border-0 bg-white rounded-lg">
        <div class="flex flex-col items-center justify-center h-full p-8 text-center bg-gray-50 dark:bg-slate-900">
          <i class="fas fa-file-pdf text-6xl text-red-500 mb-4"></i>
          <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2">PDF Preview Not Supported</h3>
          <p class="text-gray-500 dark:text-gray-400 mb-6">Your browser does not support inline PDF viewing natively.</p>
          <a [href]="selectedImageUrl" target="_blank" class="px-6 py-2.5 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors shadow-lg">
            <i class="fas fa-download mr-2"></i> Download Original PDF
          </a>
        </div>
      </object>

      <!-- Image Viewer -->
      <img *ngIf="!isPdf(selectedImageUrl)" [src]="selectedImageUrl" class="max-w-full max-h-[85vh] object-contain rounded-lg" />
    </div>
  </div>
</div>
